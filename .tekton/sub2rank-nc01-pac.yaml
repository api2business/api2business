apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: "sub2rank-nc01-{{ revision }}"
  namespace: devops-infra
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[master]"
    pipelinesascode.tekton.dev/on-cel-expression: "event == 'push' && target_branch == 'master' && node == 'NC01'"
    pipelinesascode.tekton.dev/max-keep-runs: "8"
    unidesk.ai/pac-admission-provenance: admission-pac-v2:platform-infra-sub2rank-nc01
    unidesk.ai/owning-config-ref: "config/platform-infra/sub2rank.yaml#delivery"
    unidesk.ai/effective-config-sha256: sha256:3a1e95ef9cc07e5b096319faac07c74739238e0c57619c06f7dce3519e294943
    unidesk.ai/source-artifact-renderer: sub2rank-platform-service
    unidesk.ai/source-artifact-mode: embedded-pipeline-spec
  labels:
    app.kubernetes.io/name: sub2rank
    app.kubernetes.io/part-of: platform-infra
    unidesk.ai/node: NC01
    unidesk.ai/source-commit: "{{ revision }}"
    unidesk.ai/trigger: pipelines-as-code
spec:
  timeouts:
    pipeline: 600s
  pipelineSpec:
    params:
      - name: git-read-url
        type: string
        default: http://gitea.example.com/mirrors/pikasTech-apistate.git
      - name: source-branch
        type: string
        default: master
      - name: revision
        type: string
      - name: source-stage-ref
        type: string
      - name: config-path
        type: string
        default: config/sub2rank.yaml
      - name: dockerfile
        type: string
        default: Dockerfile
      - name: image-repository
        type: string
        default: 127.0.0.1:5000/sub2rank/sub2rank
      - name: tools-image
        type: string
        default: 127.0.0.1:5000/hwlab/hwlab-ci-node-tools:node22-alpine-bun-v1
      - name: buildkit-image
        type: string
        default: 127.0.0.1:5000/hwlab/buildkit:rootless
      - name: build-network
        type: string
        default: host
      - name: build-http-proxy
        type: string
        default: http://127.0.0.1:10808
      - name: build-https-proxy
        type: string
        default: http://127.0.0.1:10808
      - name: build-all-proxy
        type: string
        default: http://127.0.0.1:10808
      - name: build-no-proxy
        type: string
        default: "localhost,127.0.0.1,::1,127.0.0.1:5000,localhost:5000,.svc,.svc.cluster.local,.cluster.local,hyueapi.com,.hyueapi.com"
      - name: gitops-read-url
        type: string
        default: http://git-mirror-http.devops-infra.svc.cluster.local:8080/pikasTech/unidesk.git
      - name: gitops-write-url
        type: string
        default: http://git-mirror-write.devops-infra.svc.cluster.local:8080/pikasTech/unidesk.git
      - name: gitops-branch
        type: string
        default: unidesk-host-gitops
      - name: gitops-manifest-path
        type: string
        default: deploy/gitops/platform-infra/sub2rank-nc01/resources.yaml
      - name: gitops-release-state-path
        type: string
        default: deploy/gitops-state/platform-infra/sub2rank-nc01.json
      - name: gitops-max-push-attempts
        type: string
        default: "3"
      - name: gitops-author-name
        type: string
        default: UniDesk Sub2Rank CI
      - name: gitops-author-email
        type: string
        default: sub2rank-ci@unidesk.local
      - name: manifest-template-b64
        type: string
        default: 
    workspaces:
      - name: source
    tasks:
      - name: source-validate
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: git-read-url
            - name: source-branch
            - name: revision
            - name: source-stage-ref
            - name: config-path
            - name: dockerfile
            - name: image-repository
            - name: tools-image
            - name: buildkit-image
            - name: build-network
            - name: build-http-proxy
            - name: build-https-proxy
            - name: build-all-proxy
            - name: build-no-proxy
            - name: gitops-read-url
            - name: gitops-write-url
            - name: gitops-branch
            - name: gitops-manifest-path
            - name: gitops-release-state-path
            - name: gitops-max-push-attempts
            - name: gitops-author-name
            - name: gitops-author-email
            - name: manifest-template-b64
          workspaces:
            - name: source
          steps:
            - name: checkout-and-cli-validate
              image: $(params.tools-image)
              imagePullPolicy: IfNotPresent
              env:
                - name: HTTP_PROXY
                  value: $(params.build-http-proxy)
                - name: http_proxy
                  value: $(params.build-http-proxy)
                - name: HTTPS_PROXY
                  value: $(params.build-https-proxy)
                - name: https_proxy
                  value: $(params.build-https-proxy)
                - name: ALL_PROXY
                  value: $(params.build-all-proxy)
                - name: all_proxy
                  value: $(params.build-all-proxy)
                - name: NO_PROXY
                  value: $(params.build-no-proxy)
                - name: no_proxy
                  value: $(params.build-no-proxy)
              script: "#!/bin/sh\nset -eu\nroot=\"$(workspaces.source.path)\"\nrm -rf \"$root/repo\"\ngit clone --filter=blob:none --no-checkout \"$(params.git-read-url)\" \"$root/repo\"\ncd \"$root/repo\"\ngit fetch --depth=1 --filter=blob:none origin \"+$(params.source-stage-ref):refs/remotes/origin/sub2rank-source-snapshot\"\ngit checkout --detach \"$(params.revision)\"\ntest \"$(git rev-parse HEAD)\" = \"$(params.revision)\"\nbun install --frozen-lockfile\nbun scripts/apistate-cli.ts --config \"$(params.config-path)\" config validate\nchmod -R a+rX,g+rwX \"$root/repo\"\nprintf '{\"ok\":true,\"phase\":\"source-validate\",\"sourceCommit\":\"%s\",\"configPath\":\"%s\",\"valuesPrinted\":false}\\n' \"$(params.revision)\" \"$(params.config-path)\""
        params:
          - name: git-read-url
            value: $(params.git-read-url)
          - name: source-branch
            value: $(params.source-branch)
          - name: revision
            value: $(params.revision)
          - name: source-stage-ref
            value: $(params.source-stage-ref)
          - name: config-path
            value: $(params.config-path)
          - name: dockerfile
            value: $(params.dockerfile)
          - name: image-repository
            value: $(params.image-repository)
          - name: tools-image
            value: $(params.tools-image)
          - name: buildkit-image
            value: $(params.buildkit-image)
          - name: build-network
            value: $(params.build-network)
          - name: build-http-proxy
            value: $(params.build-http-proxy)
          - name: build-https-proxy
            value: $(params.build-https-proxy)
          - name: build-all-proxy
            value: $(params.build-all-proxy)
          - name: build-no-proxy
            value: $(params.build-no-proxy)
          - name: gitops-read-url
            value: $(params.gitops-read-url)
          - name: gitops-write-url
            value: $(params.gitops-write-url)
          - name: gitops-branch
            value: $(params.gitops-branch)
          - name: gitops-manifest-path
            value: $(params.gitops-manifest-path)
          - name: gitops-release-state-path
            value: $(params.gitops-release-state-path)
          - name: gitops-max-push-attempts
            value: $(params.gitops-max-push-attempts)
          - name: gitops-author-name
            value: $(params.gitops-author-name)
          - name: gitops-author-email
            value: $(params.gitops-author-email)
          - name: manifest-template-b64
            value: $(params.manifest-template-b64)
      - name: image-build
        runAfter:
          - source-validate
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: git-read-url
            - name: source-branch
            - name: revision
            - name: source-stage-ref
            - name: config-path
            - name: dockerfile
            - name: image-repository
            - name: tools-image
            - name: buildkit-image
            - name: build-network
            - name: build-http-proxy
            - name: build-https-proxy
            - name: build-all-proxy
            - name: build-no-proxy
            - name: gitops-read-url
            - name: gitops-write-url
            - name: gitops-branch
            - name: gitops-manifest-path
            - name: gitops-release-state-path
            - name: gitops-max-push-attempts
            - name: gitops-author-name
            - name: gitops-author-email
            - name: manifest-template-b64
          workspaces:
            - name: source
          steps:
            - name: build-and-push
              image: $(params.buildkit-image)
              imagePullPolicy: IfNotPresent
              env:
                - name: HTTP_PROXY
                  value: $(params.build-http-proxy)
                - name: http_proxy
                  value: $(params.build-http-proxy)
                - name: HTTPS_PROXY
                  value: $(params.build-https-proxy)
                - name: https_proxy
                  value: $(params.build-https-proxy)
                - name: ALL_PROXY
                  value: $(params.build-all-proxy)
                - name: all_proxy
                  value: $(params.build-all-proxy)
                - name: NO_PROXY
                  value: $(params.build-no-proxy)
                - name: no_proxy
                  value: $(params.build-no-proxy)
                - name: BUILDKITD_FLAGS
                  value: "--oci-worker-no-process-sandbox --oci-worker-net=host --allow-insecure-entitlement network.host"
                - name: SOURCE_ROOT
                  value: $(workspaces.source.path)/repo
                - name: SOURCE_COMMIT
                  value: $(params.revision)
                - name: IMAGE_REPOSITORY
                  value: $(params.image-repository)
                - name: DOCKERFILE
                  value: $(params.dockerfile)
                - name: BUILD_NETWORK
                  value: $(params.build-network)
                - name: BUILD_METADATA_FILE
                  value: $(workspaces.source.path)/build-metadata.json
                - name: BUILD_RESULT_FILE
                  value: $(workspaces.source.path)/build-result.json
              securityContext:
                privileged: true
                runAsUser: 1000
                runAsGroup: 1000
              script: "#!/bin/sh\nset -eu\nexec \"$(workspaces.source.path)/repo/scripts/ci/build-image.sh\""
        params:
          - name: git-read-url
            value: $(params.git-read-url)
          - name: source-branch
            value: $(params.source-branch)
          - name: revision
            value: $(params.revision)
          - name: source-stage-ref
            value: $(params.source-stage-ref)
          - name: config-path
            value: $(params.config-path)
          - name: dockerfile
            value: $(params.dockerfile)
          - name: image-repository
            value: $(params.image-repository)
          - name: tools-image
            value: $(params.tools-image)
          - name: buildkit-image
            value: $(params.buildkit-image)
          - name: build-network
            value: $(params.build-network)
          - name: build-http-proxy
            value: $(params.build-http-proxy)
          - name: build-https-proxy
            value: $(params.build-https-proxy)
          - name: build-all-proxy
            value: $(params.build-all-proxy)
          - name: build-no-proxy
            value: $(params.build-no-proxy)
          - name: gitops-read-url
            value: $(params.gitops-read-url)
          - name: gitops-write-url
            value: $(params.gitops-write-url)
          - name: gitops-branch
            value: $(params.gitops-branch)
          - name: gitops-manifest-path
            value: $(params.gitops-manifest-path)
          - name: gitops-release-state-path
            value: $(params.gitops-release-state-path)
          - name: gitops-max-push-attempts
            value: $(params.gitops-max-push-attempts)
          - name: gitops-author-name
            value: $(params.gitops-author-name)
          - name: gitops-author-email
            value: $(params.gitops-author-email)
          - name: manifest-template-b64
            value: $(params.manifest-template-b64)
      - name: gitops-publish
        runAfter:
          - image-build
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: git-read-url
            - name: source-branch
            - name: revision
            - name: source-stage-ref
            - name: config-path
            - name: dockerfile
            - name: image-repository
            - name: tools-image
            - name: buildkit-image
            - name: build-network
            - name: build-http-proxy
            - name: build-https-proxy
            - name: build-all-proxy
            - name: build-no-proxy
            - name: gitops-read-url
            - name: gitops-write-url
            - name: gitops-branch
            - name: gitops-manifest-path
            - name: gitops-release-state-path
            - name: gitops-max-push-attempts
            - name: gitops-author-name
            - name: gitops-author-email
            - name: manifest-template-b64
          workspaces:
            - name: source
          steps:
            - name: publish-digest-manifest
              image: $(params.tools-image)
              imagePullPolicy: IfNotPresent
              env:
                - name: HTTP_PROXY
                  value: $(params.build-http-proxy)
                - name: http_proxy
                  value: $(params.build-http-proxy)
                - name: HTTPS_PROXY
                  value: $(params.build-https-proxy)
                - name: https_proxy
                  value: $(params.build-https-proxy)
                - name: ALL_PROXY
                  value: $(params.build-all-proxy)
                - name: all_proxy
                  value: $(params.build-all-proxy)
                - name: NO_PROXY
                  value: $(params.build-no-proxy)
                - name: no_proxy
                  value: $(params.build-no-proxy)
              script: "#!/bin/sh\nset -eu\nroot=\"$(workspaces.source.path)\"\nexec bun \"$root/repo/scripts/ci/publish-gitops.mjs\" \\\n  --source-root \"$root/repo\" \\\n  --source-commit \"$(params.revision)\" \\\n  --config-path \"$(params.config-path)\" \\\n  --metadata \"$root/build-metadata.json\" \\\n  --manifest-template-b64 \"$(params.manifest-template-b64)\" \\\n  --image-repository \"$(params.image-repository)\" \\\n  --gitops-read-url \"$(params.gitops-read-url)\" \\\n  --gitops-write-url \"$(params.gitops-write-url)\" \\\n  --gitops-branch \"$(params.gitops-branch)\" \\\n  --manifest-path \"$(params.gitops-manifest-path)\" \\\n  --release-state-path \"$(params.gitops-release-state-path)\" \\\n  --max-push-attempts \"$(params.gitops-max-push-attempts)\" \\\n  --author-name \"$(params.gitops-author-name)\" \\\n  --author-email \"$(params.gitops-author-email)\" \\\n  --worktree \"$root/gitops\""
        params:
          - name: git-read-url
            value: $(params.git-read-url)
          - name: source-branch
            value: $(params.source-branch)
          - name: revision
            value: $(params.revision)
          - name: source-stage-ref
            value: $(params.source-stage-ref)
          - name: config-path
            value: $(params.config-path)
          - name: dockerfile
            value: $(params.dockerfile)
          - name: image-repository
            value: $(params.image-repository)
          - name: tools-image
            value: $(params.tools-image)
          - name: buildkit-image
            value: $(params.buildkit-image)
          - name: build-network
            value: $(params.build-network)
          - name: build-http-proxy
            value: $(params.build-http-proxy)
          - name: build-https-proxy
            value: $(params.build-https-proxy)
          - name: build-all-proxy
            value: $(params.build-all-proxy)
          - name: build-no-proxy
            value: $(params.build-no-proxy)
          - name: gitops-read-url
            value: $(params.gitops-read-url)
          - name: gitops-write-url
            value: $(params.gitops-write-url)
          - name: gitops-branch
            value: $(params.gitops-branch)
          - name: gitops-manifest-path
            value: $(params.gitops-manifest-path)
          - name: gitops-release-state-path
            value: $(params.gitops-release-state-path)
          - name: gitops-max-push-attempts
            value: $(params.gitops-max-push-attempts)
          - name: gitops-author-name
            value: $(params.gitops-author-name)
          - name: gitops-author-email
            value: $(params.gitops-author-email)
          - name: manifest-template-b64
            value: $(params.manifest-template-b64)
  taskRunTemplate:
    serviceAccountName: sub2rank-nc01-tekton-runner
    podTemplate:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
  params:
    - name: git-read-url
      value: "{{ git_read_url }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: revision
      value: "{{ revision }}"
    - name: source-stage-ref
      value: "{{ source_snapshot_prefix }}/{{ revision }}"
    - name: config-path
      value: config/sub2rank.yaml
    - name: dockerfile
      value: Dockerfile
    - name: image-repository
      value: "{{ image_repository }}"
    - name: tools-image
      value: 127.0.0.1:5000/hwlab/hwlab-ci-node-tools:node22-alpine-bun-v1
    - name: buildkit-image
      value: 127.0.0.1:5000/hwlab/buildkit:rootless
    - name: build-network
      value: host
    - name: build-http-proxy
      value: http://127.0.0.1:10808
    - name: build-https-proxy
      value: http://127.0.0.1:10808
    - name: build-all-proxy
      value: http://127.0.0.1:10808
    - name: build-no-proxy
      value: "localhost,127.0.0.1,::1,127.0.0.1:5000,localhost:5000,.svc,.svc.cluster.local,.cluster.local,hyueapi.com,.hyueapi.com"
    - name: gitops-read-url
      value: http://git-mirror-http.devops-infra.svc.cluster.local:8080/pikasTech/unidesk.git
    - name: gitops-write-url
      value: http://git-mirror-write.devops-infra.svc.cluster.local:8080/pikasTech/unidesk.git
    - name: gitops-branch
      value: "{{ gitops_branch }}"
    - name: gitops-manifest-path
      value: "{{ gitops_manifest_path }}"
    - name: gitops-release-state-path
      value: deploy/gitops-state/platform-infra/sub2rank-nc01.json
    - name: gitops-max-push-attempts
      value: "3"
    - name: gitops-author-name
      value: UniDesk Sub2Rank CI
    - name: gitops-author-email
      value: sub2rank-ci@unidesk.local
    - name: manifest-template-b64
      value: 
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
