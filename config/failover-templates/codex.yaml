apiVersion: api2business.pikapython.com/v1
kind: FailoverTemplate
name: codex-upstream-failover
platform: openai
rules:
- errorCode: 422
  keywords:
  - upstream request failed
  durationMinutes: 3
  description: 上游实际返回 422 且统一包装为 upstream request failed 时短暂切号
- errorCode: 429
  keywords:
  - usage limit reached
  - API key 额度已用完
  - concurrency limit exceeded for account
  - rate_limit_exceeded
  - rate limit exceeded
  - rate_limit_error
  - rate limit error
  - upstream rate limit exceeded
  - too many pending requests
  - selected model is at capacity
  - 'status code: 429'
  - please retry later
  - retry later
  - 服务暂时不可用，请稍后重试
  durationMinutes: 3
  description: 账号限流、并发上限或模型容量暂时不足
- errorCode: 400
  keywords:
  - selected model is at capacity
  - our servers are currently overloaded
  - please try again later
  - upstream request failed
  - invalid_encrypted_content
  - too many pending requests
  - concurrency limit exceeded for account
  - concurrency limit exceeded
  - rate_limit_exceeded
  - rate_limit_error
  - bad_response_status_code
  - openai_error
  - unknown provider for model gpt-5.6-terra
  - unknown provider for model gpt-5.6-sol
  - no tool output found for custom tool call
  - no tool call found for function call output
  durationMinutes: 3
  description: 上游明确返回 gpt-5.6-terra 或 gpt-5.6-sol 的 Provider 不支持、模型容量、工具调用上下文缺失、临时过载、包装层故障或供应商上下文空间故障
- errorCode: 401
  keywords:
  - invalid api key
  - invalid_api_key
  - authentication failed
  - unauthorized
  - token expired
  - api key expired
  durationMinutes: 10
  description: 上游 API key 认证失效
- errorCode: 402
  keywords:
  - insufficient account balance
  - insufficient balance
  - payment required
  - account balance depleted
  - billing hard limit
  - balance is insufficient
  - 余额不足
  - 欠费
  durationMinutes: 10
  description: 上游明确返回余额或账单不足
- errorCode: 403
  keywords:
  - insufficient_balance
  - insufficient account balance
  - insufficient balance
  - payment required
  - account balance depleted
  - failed to validate api key
  - invalid api key
  - invalid_api_key
