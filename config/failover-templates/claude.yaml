apiVersion: api2business.pikapython.com/v1
kind: FailoverTemplate
name: claude-upstream-failover
platform: anthropic
rules:
- errorCode: 400
  keywords:
  - 请求参数或格式不正确
  - The request could not be processed. Please check the request parameters.
  durationMinutes: 3
  description: Claude 供应商兼容层拒绝当前请求格式时短暂冷却并切换账号；不泛化匹配其他 invalid_request_error
- errorCode: 429
  keywords:
  - rate_limit_error
  - rate limit exceeded
  - too many pending requests
  - selected model is at capacity
  - api is at capacity
  durationMinutes: 3
  description: Claude 上游限流、并发或模型容量暂时不足
- errorCode: 403
  keywords:
  - insufficient balance
  - insufficient_balance
  - insufficient_quota
  - credit_balance_exhausted
  - payment required
  - account balance depleted
  - invalid api key
  - invalid_api_key
  durationMinutes: 10
  description: Claude 上游余额不足或 API key 失效
- errorCode: 502
  keywords:
  - upstream access forbidden
  durationMinutes: 10
  description: Claude 上游权限拒绝或供应商账号不可用，延长冷却避免重复打到同一账号
- errorCode: 502
  keywords:
  - upstream_error
  - upstream request failed
  - upstream response stream was interrupted
  - upstream stream disconnected
  - stream_read_error
  - origin web server returned an invalid or incomplete response
  - bad_response_status_code
  durationMinutes: 3
  description: Claude 上游网关、流中断或包装层故障
- errorCode: 503
  keywords:
  - local_capacity_exhausted
  - no available accounts
  - no healthy account
  - service temporarily unavailable
  - temporarily unavailable
  - upstream service temporarily unavailable
  - upstream_error
  - overloaded
  - please try again later
  - 服务暂时繁忙
  - 服务暂时不可用
  durationMinutes: 3
  description: Claude 上游服务暂时不可用或容量耗尽
- errorCode: 521
  keywords:
  - origin_down
  - connection was refused
  - 'error code: 521'
  - 'status code: 521'
  durationMinutes: 3
  description: Claude 上游 Cloudflare origin 不可达
- errorCode: 520
  keywords:
  - 'error code: 520'
  - 'status code: 520'
  durationMinutes: 3
  description: Claude 上游 Cloudflare 未分类瞬态错误
