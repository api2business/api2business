apiVersion: api2business.pikapython.com/v1
kind: Api2Business

metadata:
  name: api2business
  owner: example

monitor:
  timezone: Asia/Shanghai
  refreshIntervalMinutes: 5
  automaticRefresh:
    enabled: true
  recentCallLimit: 1000
  errorAggregateLimit: 1000
  errorAggregateTop: 20
  recentCallOptions:
    - 100
    - 500
    - 1000
    - 2000
    - 5000
  target: example-runtime
  cli:
    workDir: /integrations
    executable: /usr/local/bin/bun
    entrypoint: scripts/cli.ts
    mainServerHost: 127.0.0.1
    timeoutMs: 180000

webAuth:
  username: admin
  cookieName: api2business_session
  sessionTtlSeconds: 43200

bugTeam:
  baseUrl: https://bugteam.team
  requestTimeoutMs: 30000
  customerToken:
    sourceRef: platform-infra/api2business.env
    sourceKey: BUGTEAM_CUSTOMER_TOKEN
  customerAccount:
    sourceRef: platform-infra/api2business.env
    sourceKey: BUGTEAM_CUSTOMER_ACCOUNT
  customerPassword:
    sourceRef: platform-infra/api2business.env
    sourceKey: BUGTEAM_CUSTOMER_PASSWORD
  monitor:
    enabled: true
    product: team_1h
    sampleIntervalSeconds: 60
    expectedOutputApiUsd: 28
    historyHours: 24

webProbe:
  enabled: false
  productId: api2business
  runner:
    node: NC01
    lane: v03
  origin:
    baseUrl: https://api2business.example.com
    browserProxyMode: direct
  authentication:
    mode: provided-session-cookie
    cookieName: api2business_session
  defaultSmokeProfile: upstream-scheduling-v2
  smokeProfiles:
    upstream-scheduling-v2:
      path: /upstream-scheduling-v2
      readySelector: "#v2-data-state"
      screenshotName: api2business-upstream-scheduling-v2-desktop.png
      mobileScreenshotName: api2business-upstream-scheduling-v2-mobile.png
      viewport: { width: 1920, height: 1080 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 5000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }
    account-import:
      path: /account-import
      readySelector: body
      screenshotName: api2business-account-import-desktop.png
      mobileScreenshotName: api2business-account-import-mobile.png
      viewport: { width: 1920, height: 1080 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 3000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }
    bugteam-cost:
      path: /bugteam-cost
      readySelector: "#bugteam-state"
      screenshotName: api2business-bugteam-cost-desktop.png
      mobileScreenshotName: api2business-bugteam-cost-mobile.png
      viewport: { width: 1920, height: 1080 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 3000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }
    bugteam-cost-mobile:
      path: /bugteam-cost
      readySelector: "#bugteam-state"
      screenshotName: api2business-bugteam-cost-mobile.png
      mobileScreenshotName: api2business-bugteam-cost-mobile-secondary.png
      viewport: { width: 390, height: 844 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 3000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }
    observability:
      path: /observability
      readySelector: '#observability-state[data-ready="true"]'
      screenshotName: api2business-observability-desktop.png
      mobileScreenshotName: api2business-observability-mobile.png
      viewport:
        width: 1920
        height: 1080
      mobileViewport:
        width: 390
        height: 844
      navigationTimeoutMs: 30000
      settleMs: 2000
      commandTimeoutSeconds: 90
      outputLimits:
        failures: 12
        network: 40
        console: 12

sub2api:
  baseUrl: https://api.example.com/api/v1
  requestTimeoutMs: 20000
  pageSize: 100
  # Optional NewAPI account logins used only for read-only account balance checks.
  # Values are resolved from runtime.secretSourcePaths; never put credentials here.
  # Multiple API hosts for one provider wallet may repeat the same secret refs
  # and set one shared walletKey so every account receives the same cached balance.
  # walletKey is the read-only balance identity; it does not expand recharge writes.
  newApiCredentials: []
  scoreDatabase:
    sourceRef: secrets/sub2api.env
    sourceKey: DATABASE_URL
    statementTimeoutMs: 15000
    queueTimeoutMs: 30000
    cacheTtlMs: 5000
    cacheMaxEntries: 64
  scorePolicy:
    reliabilityWeight: 48
    failoverWeight: 10
    latencyWeight: 37
    baselineWeight: 5
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 5000
    ttftZeroScoreMs: 55000
    ttftPriorScore: 25
  poolScorePolicy:
    reliabilityWeight: 58
    failoverWeight: 0
    latencyWeight: 37
    baselineWeight: 5
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 5000
    ttftZeroScoreMs: 90000
    ttftPriorScore: 25
  grokScorePolicy:
    reliabilityWeight: 55
    failoverWeight: 15
    latencyWeight: 30
    baselineWeight: 0
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 7000
    ttftZeroScoreMs: 70000
    ttftPriorScore: 25
  scoreSamplePolicy:
    retentionHours: 8
    decayBucketSize: 100
    decayStep: 0.1
    minimumWeight: 0.1
  idleProbe:
    intervalSeconds: 60
    idleSeconds: 600
    model: gpt-5.6-terra
    platformModels:
      openai: [ gpt-5.6-terra, gpt-5.6-sol ]
      anthropic: [ claude-sonnet-5-5 ]
      grok: [ grok-4.5 ]
    reasoningEffort: low
    candidateLimit: 10
    concurrency: 1000
    accountTimeoutMs: 30000
    requestJitterMinMs: 1000
    requestJitterMaxMs: 3000
    roundTimeoutSeconds: 50
    provisionCandidateLimit: 1
    provisionTimeoutSeconds: 120
    isolation:
      enabled: true
      gatewayBaseUrl: https://api.example.com/v1
      groupNamePrefix: api2business-probe-
      groupRateMultiplier: 1
      userBalance: 100
      secretFile: .state/idle-probe/probe-keys.json
  priorityPlan:
    platform: openai
    eligibleGroupIds: [ 2, 3 ]
    requiredConfidence: high
    requireCurrentAvailable: true
    reliabilityWeight: 35
    latencyWeight: 28
    costWeight: 24
    evidenceWeight: 10
    evidenceTargetAttempts: 50
    evidenceTargetFirstTokenSamples: 20
    explorationWeight: 2
    explorationTargetAttempts: 50
    explorationQualityPrior: 25
    balanceWeight: 1
    referenceScore: 92
    pointsPerScore: 10
    minimumChange: 5
    normalizationTopK: 20
    forceNormalizedTopK: false
    minimumPriorityUniformity: 0.25
    minimumPriority: 100
    maximumPriority: 300
    fixedPriorities: {}
    reservePolicies: {}
    procurementAdvice:
      enabled: true
      minimumQualityScore: 75
      valueWeight: 80
      redundancyWeight: 20
      recommendationLimit: 2
      statusAlertLimit: 20
      maximumRecommendationsPerSupplier: 1
      minimumSupplierCount: 4
      maximumSupplierShare: 0.4
      billingErrorPatterns:
        - insufficient account balance
        - insufficient balance
        - payment required
        - account balance depleted
        - 余额不足
        - 用户额度不足
        - 预扣费额度失败
        - 欠费
  claudePriorityPlan:
    platform: anthropic
    eligibleGroupIds: [ 119 ]
    requiredConfidence: high
    requireCurrentAvailable: true
    reliabilityWeight: 60
    latencyWeight: 25
    costWeight: 8
    evidenceWeight: 4
    evidenceTargetAttempts: 50
    evidenceTargetFirstTokenSamples: 20
    explorationWeight: 2
    explorationTargetAttempts: 50
    explorationQualityPrior: 25
    balanceWeight: 1
    referenceScore: 92
    pointsPerScore: 10
    minimumChange: 5
    normalizationTopK: 20
    forceNormalizedTopK: false
    minimumPriorityUniformity: 0.25
    minimumPriority: 100
    maximumPriority: 300
    fixedPriorities: {}
    reservePolicies: {}
    procurementAdvice:
      enabled: false
      minimumQualityScore: 75
      valueWeight: 80
      redundancyWeight: 20
      recommendationLimit: 2
      statusAlertLimit: 20
      maximumRecommendationsPerSupplier: 1
      minimumSupplierCount: 4
      maximumSupplierShare: 0.4
      billingErrorPatterns:
        - insufficient account balance
        - insufficient balance
        - payment required
        - account balance depleted
        - 余额不足
        - 用户额度不足
        - 预扣费额度失败
        - 欠费
  grokPriorityPlan:
    platform: grok
    eligibleGroupIds: [ 62 ]
    requiredConfidence: high
    requireCurrentAvailable: true
    reliabilityWeight: 70
    latencyWeight: 30
    costWeight: 0
    evidenceWeight: 0
    evidenceTargetAttempts: 50
    evidenceTargetFirstTokenSamples: 20
    explorationWeight: 0
    explorationTargetAttempts: 50
    explorationQualityPrior: 0
    balanceWeight: 0
    referenceScore: 80
    pointsPerScore: 8
    minimumChange: 5
    normalizationTopK: 20
    forceNormalizedTopK: true
    minimumPriorityUniformity: 0.25
    minimumPriority: 100
    maximumPriority: 300
    fixedPriorities: {}
    reservePolicies: {}
    procurementAdvice:
      enabled: false
      minimumQualityScore: 80
      valueWeight: 80
      redundancyWeight: 20
      recommendationLimit: 3
      statusAlertLimit: 20
      maximumRecommendationsPerSupplier: 1
      minimumSupplierCount: 4
      maximumSupplierShare: 0.4
      billingErrorPatterns:
        - insufficient account balance
        - insufficient balance
        - payment required
        - account balance depleted
        - 余额不足
        - 用户额度不足
        - 预扣费额度失败
        - 欠费
  adminCredentials:
    sourceRef: secrets/sub2api.env
    emailKey: ADMIN_EMAIL
    passwordKey: ADMIN_PASSWORD

lottery:
  timezone: Asia/Shanghai
  initialDrawCount: 1
  dailyGrant:
    hour: 6
    minute: 0
    count: 1
  eligibility:
    activeWithinHours: 24
    statuses:
      - active
    excludedRoles:
      - admin
    excludedIdentities:
      - example-user
    identityFields:
      - username
      - email
      - emailLocalPart
  prize:
    amountUsd: 100
  automaticCredit:
    enabled: false
    mode: dry-run
    notesPrefix: Api2Business 每日抽奖奖金
  creditTest:
    targetIdentifier: admin
    identityFields:
      - username
      - emailLocalPart
    amountUsd: 0.01
    notes: Api2Business CLI 管理员充值链路测试

ranking:
  timezone: Asia/Shanghai
  windowDays: 1
  sourceLimit: 100
  displayLimit: 20

records:
  publicLimit: 20

operations:
  writePolicy:
    enabled: false
    claudeEnabled: false
  upstreamSchedulingV2:
    enabled: true
    defaultScope: codex
    readModelCacheSeconds: 30
    readModelRefreshTimeoutSeconds: 60
    automation:
      intervalSeconds: 600
      recentCallLimit: 1000
    modelSync:
      batchSize: 10
      intervalSeconds: 600
    scopes:
      codex:
        enabled: true
        platform: openai
        eligibleGroupIds: [ 2, 3 ]
        idleProbeIntervalSeconds: 60
        features:
          scoreRead: true
          planRead: true
          planWrite: false
          priorityAutomation: false
          idleProbe: false
          upstreamWrite: false
          modelSyncAutomation: false
      claude:
        enabled: true
        platform: anthropic
        eligibleGroupIds: [ 119 ]
        idleProbeIntervalSeconds: 300
        features:
          scoreRead: true
          planRead: true
          planWrite: false
          priorityAutomation: false
          idleProbe: false
          upstreamWrite: false
          modelSyncAutomation: false
      grok:
        enabled: true
        platform: grok
        eligibleGroupIds: [ 62 ]
        idleProbeIntervalSeconds: 60
        features:
          scoreRead: true
          planRead: true
          planWrite: false
          priorityAutomation: false
          idleProbe: false
          upstreamWrite: false
          modelSyncAutomation: false
  databaseUrlEnv: API2BUSINESS_DATABASE_URL
  databasePrepareStatements: true
  ledgerYamlPath: /var/lib/api2business/sub2api-pool.yaml
  accountImportLedgerPath: /var/lib/api2business/ledger/account-import-costs.jsonl
  upstreamRechargeLedgerPath: /var/lib/api2business/ledger/upstream-recharge-costs.jsonl
  accountLifecycleLedgerPath: /var/lib/api2business/ledger/account-lifecycle-settlements.jsonl
  accountImportArchiveDirectory: /var/lib/api2business/account-imports
  accountLifecycle:
    defaultModel: gpt-5.6-sol
    testBatchSize: 8
    testTimeoutMs: 1800000
    deleteTimeoutMs: 600000
    deleteBatchSize: 10
  accountImportDefaults:
    priority: 1
    capacity: 3
    rateMultiplier: 1000
    importTimeoutMs: 600000
    groupIds: [ 2, 3 ]
    sourceProxyId: 0
    perAccountProxy: false
    planType: k12
    freeCostThresholdCny: 1
    plusCostThresholdCny: 7
  upstreamManagement:
    pageSize: 10
    defaultTemplate: codex-upstream-failover
    primaryGroupId: 2
    groupIds: [ 2, 3 ]
    priority: 1
    capacity: 16
    proxyId: 0
    # 创建接口要求名称包含正费率；创建完成后会立即探测并回写真实倍率。
    createBootstrapRateCnyPerApiUsd: 1
    # 创建时未指定成本且探测不到有效倍率时使用的回退费率。
    unprobedFallbackRateCnyPerApiUsd: 0.1
    mutationTimeoutMs: 120000
    usageConcurrency: 8
    usageTimeoutMs: 15000
    usageDays: 30
    quotaSampleIntervalSeconds: 600
    quotaSampleTimeoutSeconds: 240
    rechargeCandidates:
      lowBalanceCny: 10
      lookbackHours: 24
      recommendationLimit: 20
      retiredSuppliers: []
    templateFiles:
      codex: config/failover-templates/codex.yaml
      claude: config/failover-templates/claude.yaml
    externalCutoff:
      enabled: true
      dryRun: true
      durationSeconds: 60
      rules:
        - statusCodes: [ 499, 502, 503, 504, 522, 524 ]
          keywords:
            [
              stream_read_error,
              stream disconnected before completion,
              upstream stream disconnected,
              upstream_unavailable,
              upstream service temporarily unavailable,
              unexpected eof
            ]
          description: 原生模板未切号的上游断流，外部补偿冷却 1 分钟
  upstreamBenchmark:
    enabled: true
    provider: https://apitest.work/
    benchmarkVersion: acceptance-2026.07-compatible-v1
    model: gpt-5.6-luna
    requestTimeoutMs: 75000
  oauthEconomics:
    excludedAccountIds: [ 999999 ]
    idealApiUsdPerAccount:
      free: 3.8
      k12: 20
      plus: 135
      team: 28
  rechargeDenominationsCny: [ 10, 20, 50 ]
  planTtlMinutes: 30
  auditLimit: 200
  priorityVerificationTimeoutMs: 15000
  priorityVerificationPollMs: 500
  automationJitterPercent: 0.1
  automationSafety:
    maximumScoreQueryDurationMs: 3000
  priorityWrite:
    batchSize: 3
    requestTimeoutMs: 30000
    interBatchMinimumDelayMs: 1000
    interBatchMaximumDelayMs: 2000
    maximumRetries: 3
    retryInitialDelayMs: 2000
    retryJitterPercent: 0.2

temporal:
  addressEnv: API2BUSINESS_TEMPORAL_ADDRESS
  namespace: default
  taskQueue: api2business
  scoreScheduleWorkflowId: api2business-score-refresh-schedule
  submissionTimeoutMs: 10000
  workflowExecutionTimeout: 20m
  activityStartToCloseTimeout: 15m
  retry:
    maximumAttempts: 1

runtime:
  secretsRoot: /etc/api2business/secrets
  secretSourcePaths:
    secrets/admin-password.txt: /etc/api2business/secrets/admin-password.txt
    secrets/sub2api.env: /etc/api2business/secrets/sub2api.env
    secrets/api2business.env: /etc/api2business/secrets/api2business.env
    secrets/database.env: /etc/api2business/secrets/database.env
  defaultCliTarget: l1
  overApiTarget: l1
  cliTargets:
    l1:
      mode: http
      baseUrl: https://api2business.example.com
      adminToken:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_API_KEY
  native:
    mode: docker-compose
    composeFile: compose.yaml
    composeProject: api2business-l1
    composeEnvFile: .state/compose/api2business.env
    stateDir: .state/native
    temporalAddress: 127.0.0.1:7233
    env:
      API2BUSINESS_WEB_PASSWORD:
        sourceRef: secrets/admin-password.txt
        sourceKey: contents
      API2BUSINESS_API_KEY:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_API_KEY
      API2BUSINESS_SESSION_SECRET:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_SESSION_SECRET
      SUB2API_ADMIN_EMAIL:
        sourceRef: secrets/sub2api.env
        sourceKey: ADMIN_EMAIL
      SUB2API_ADMIN_PASSWORD:
        sourceRef: secrets/sub2api.env
        sourceKey: ADMIN_PASSWORD
      DATABASE_URL:
        sourceRef: secrets/sub2api.env
        sourceKey: DATABASE_URL
      API2BUSINESS_DATABASE_URL:
        sourceRef: secrets/database.env
        sourceKey: API2BUSINESS_DATABASE_URL
    services:
      api:
        envKeys:
          - API2BUSINESS_WEB_PASSWORD
          - API2BUSINESS_API_KEY
          - API2BUSINESS_SESSION_SECRET
          - SUB2API_ADMIN_EMAIL
          - SUB2API_ADMIN_PASSWORD
          - DATABASE_URL
          - API2BUSINESS_DATABASE_URL
          - API2BUSINESS_TEMPORAL_ADDRESS
        command:
          - bun
          - src/api.ts
          - --config
          - config/api2business.example.yaml
          - --runtime
          - native
        pidFile: api.pid
        logFile: api.log
      worker:
        envKeys:
          - API2BUSINESS_API_KEY
          - API2BUSINESS_TEMPORAL_ADDRESS
        command:
          - go-worker/bin/api2business-temporal-worker
          - --config
          - config/api2business.example.yaml
          - --runtime
          - native
        pidFile: worker.pid
        logFile: worker.log
      web:
        envKeys: []
        command:
          - bunx
          - vite
          - --config
          - vite.config.ts
        pidFile: web.pid
        logFile: web.log
  serverTargets:
    compose:
      listenHost: 127.0.0.1
      listenPort: 8080
      workerHealthHost: 127.0.0.1
      workerHealthPort: 8081
      webListenHost: 127.0.0.1
      webListenPort: 15173
      webAllowedHosts: [ api2business.example.com ]
      webApiBaseUrl: http://127.0.0.1:8080
      secureCookies: false
      databasePath: .state/api2business.sqlite
      scoreCachePath: .state/account-scores.json
      monitorWorkDir: /integrations
      temporalTaskQueue: api2business-compose
      scoreScheduleWorkflowId: api2business-compose-score-refresh-schedule
      adminTokenEnv: API2BUSINESS_API_KEY
      sub2apiAdminEmailEnv: SUB2API_ADMIN_EMAIL
      sub2apiAdminPasswordEnv: SUB2API_ADMIN_PASSWORD
      scoreDatabaseUrlEnv: DATABASE_URL
      webPasswordEnv: API2BUSINESS_WEB_PASSWORD
      apiKeyEnv: API2BUSINESS_API_KEY
      sessionSecretEnv: API2BUSINESS_SESSION_SECRET
    native:
      listenHost: 127.0.0.1
      listenPort: 8080
      workerHealthHost: 127.0.0.1
      workerHealthPort: 8081
      webListenHost: 127.0.0.1
      webListenPort: 15173
      webAllowedHosts:
        - api2business.example.com
      webApiBaseUrl: http://127.0.0.1:8080
      secureCookies: false
      databasePath: .state/api2business.sqlite
      scoreCachePath: .state/account-scores.json
      monitorWorkDir: /integrations
      temporalTaskQueue: api2business-native
      scoreScheduleWorkflowId: api2business-native-score-refresh-schedule
      adminTokenEnv: API2BUSINESS_API_KEY
      sub2apiAdminEmailEnv: SUB2API_ADMIN_EMAIL
      sub2apiAdminPasswordEnv: SUB2API_ADMIN_PASSWORD
      scoreDatabaseUrlEnv: DATABASE_URL
      webPasswordEnv: API2BUSINESS_WEB_PASSWORD
      apiKeyEnv: API2BUSINESS_API_KEY
      sessionSecretEnv: API2BUSINESS_SESSION_SECRET
observability:
  sub2apiSuccessPercent: 99
  sub2apiTtftP95Ms: 30000
  api2businessNon5xxPercent: 99.9
  api2businessLatencyP95Ms: 3000
  walletFreshnessSeconds: 3600
  retentionDays: 30
