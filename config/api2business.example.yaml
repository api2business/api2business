apiVersion: api2business.pikapython.com/v1
kind: Api2Business

metadata:
  name: api2business
  owner: example

monitor:
  timezone: Asia/Shanghai
  refreshIntervalMinutes: 5
  automaticRefresh:
    enabled: true
  recentCallLimit: 1000
  errorAggregateLimit: 1000
  errorAggregateTop: 20
  recentCallOptions:
    - 100
    - 500
    - 1000
    - 2000
    - 5000
  target: example-runtime
  cli:
    workDir: /integrations
    executable: /usr/local/bin/bun
    entrypoint: scripts/cli.ts
    mainServerHost: 127.0.0.1
    timeoutMs: 180000

webAuth:
  username: admin
  cookieName: api2business_session
  sessionTtlSeconds: 43200

webProbe:
  enabled: false
  productId: api2business
  runner:
    node: NC01
    lane: v03
  origin:
    baseUrl: https://api2business.example.com
    browserProxyMode: direct
  authentication:
    mode: provided-session-cookie
    cookieName: api2business_session
  defaultSmokeProfile: scores-layout
  smokeProfiles:
    scores-layout:
      path: /scores
      readySelector: "#score-updated-time"
      screenshotName: api2business-scores-desktop.png
      mobileScreenshotName: api2business-scores-mobile.png
      viewport: { width: 1920, height: 1080 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 5000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }
    account-import:
      path: /account-import
      readySelector: body
      screenshotName: api2business-account-import-desktop.png
      mobileScreenshotName: api2business-account-import-mobile.png
      viewport: { width: 1920, height: 1080 }
      mobileViewport: { width: 390, height: 844 }
      navigationTimeoutMs: 30000
      settleMs: 3000
      commandTimeoutSeconds: 90
      outputLimits: { failures: 12, network: 40, console: 12 }

sub2api:
  baseUrl: https://api.example.com/api/v1
  requestTimeoutMs: 20000
  pageSize: 100
  scoreDatabase:
    sourceRef: secrets/sub2api.env
    sourceKey: DATABASE_URL
    statementTimeoutMs: 15000
    queueTimeoutMs: 30000
    cacheTtlMs: 5000
    cacheMaxEntries: 64
  scorePolicy:
    reliabilityWeight: 48
    failoverWeight: 10
    latencyWeight: 37
    baselineWeight: 5
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 5000
    ttftZeroScoreMs: 55000
  poolScorePolicy:
    reliabilityWeight: 58
    failoverWeight: 0
    latencyWeight: 37
    baselineWeight: 5
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 5000
    ttftZeroScoreMs: 55000
  grokScorePolicy:
    reliabilityWeight: 50
    failoverWeight: 15
    latencyWeight: 25
    baselineWeight: 10
    failureZeroScoreRate: 0.2
    failureBurstCallLimit: 100
    failoverZeroScoreRate: 0.2
    ttftFullScoreMs: 7000
    ttftZeroScoreMs: 70000
  scoreSamplePolicy:
    retentionHours: 8
    decayBucketSize: 100
    decayStep: 0.1
    minimumWeight: 0.1
  idleProbe:
    enabled: true
    intervalSeconds: 60
    idleSeconds: 600
    model: gpt-5.6-terra
    reasoningEffort: low
    candidateLimit: 10
    concurrency: 1000
    accountTimeoutMs: 30000
    requestJitterMinMs: 1000
    requestJitterMaxMs: 3000
    roundTimeoutSeconds: 50
    provisionCandidateLimit: 1
    provisionTimeoutSeconds: 120
    isolation:
      enabled: true
      gatewayBaseUrl: https://api.example.com/v1
      groupNamePrefix: api2business-probe-
      groupRateMultiplier: 1
      userBalance: 100
      secretFile: .state/idle-probe/probe-keys.json
  priorityPlan:
    platform: openai
    eligibleGroupIds: [2, 3]
    requiredConfidence: high
    requireCurrentAvailable: true
    qualityWeight: 45
    costWeight: 35
    explorationWeight: 8
    explorationTargetAttempts: 50
    explorationQualityPrior: 25
    balanceWeight: 12
    dynamicQualityFeedback:
      targetQualityScore: 85
      coefficient: 2
    referenceScore: 92
    pointsPerScore: 10
    minimumChange: 5
    normalizationTopK: 20
    minimumPriorityUniformity: 0.25
    minimumPriority: 100
    maximumPriority: 300
    fixedPriorities: {}
    reservePolicies: {}
    procurementAdvice:
      enabled: true
      minimumQualityScore: 75
      valueWeight: 80
      redundancyWeight: 20
      recommendationLimit: 2
      statusAlertLimit: 20
      maximumRecommendationsPerSupplier: 1
      minimumSupplierCount: 4
      maximumSupplierShare: 0.4
      billingErrorPatterns:
        - insufficient account balance
        - insufficient balance
        - payment required
        - account balance depleted
        - 余额不足
        - 用户额度不足
        - 预扣费额度失败
        - 欠费
  grokPriorityPlan:
    platform: grok
    eligibleGroupIds: [6]
    requiredConfidence: high
    requireCurrentAvailable: true
    qualityWeight: 85
    costWeight: 15
    explorationWeight: 0
    explorationTargetAttempts: 50
    explorationQualityPrior: 0
    balanceWeight: 0
    dynamicQualityFeedback:
      targetQualityScore: 85
      coefficient: 0
    referenceScore: 80
    pointsPerScore: 8
    minimumChange: 5
    normalizationTopK: 20
    minimumPriorityUniformity: 0.25
    minimumPriority: 100
    maximumPriority: 300
    fixedPriorities: {}
    reservePolicies: {}
    procurementAdvice:
      enabled: false
      minimumQualityScore: 80
      valueWeight: 80
      redundancyWeight: 20
      recommendationLimit: 3
      statusAlertLimit: 20
      maximumRecommendationsPerSupplier: 1
      minimumSupplierCount: 4
      maximumSupplierShare: 0.4
      billingErrorPatterns:
        - insufficient account balance
        - insufficient balance
        - payment required
        - account balance depleted
        - 余额不足
        - 用户额度不足
        - 预扣费额度失败
        - 欠费
  adminCredentials:
    sourceRef: secrets/sub2api.env
    emailKey: ADMIN_EMAIL
    passwordKey: ADMIN_PASSWORD

lottery:
  timezone: Asia/Shanghai
  initialDrawCount: 1
  dailyGrant:
    hour: 6
    minute: 0
    count: 1
  eligibility:
    activeWithinHours: 24
    statuses:
      - active
    excludedRoles:
      - admin
    excludedIdentities:
      - example-user
    identityFields:
      - username
      - email
      - emailLocalPart
  prize:
    amountUsd: 100
  automaticCredit:
    enabled: false
    mode: dry-run
    notesPrefix: Api2Business 每日抽奖奖金
  creditTest:
    targetIdentifier: admin
    identityFields:
      - username
      - emailLocalPart
    amountUsd: 0.01
    notes: Api2Business CLI 管理员充值链路测试

ranking:
  timezone: Asia/Shanghai
  windowDays: 1
  sourceLimit: 100
  displayLimit: 20

records:
  publicLimit: 20

operations:
  databaseUrlEnv: API2BUSINESS_DATABASE_URL
  ledgerYamlPath: /var/lib/api2business/sub2api-pool.yaml
  accountImportLedgerPath: /var/lib/api2business/ledger/account-import-costs.jsonl
  upstreamRechargeLedgerPath: /var/lib/api2business/ledger/upstream-recharge-costs.jsonl
  accountLifecycleLedgerPath: /var/lib/api2business/ledger/account-lifecycle-settlements.jsonl
  accountImportArchiveDirectory: /var/lib/api2business/account-imports
  accountLifecycle:
    defaultModel: gpt-5.6-sol
    testBatchSize: 8
    testTimeoutMs: 1800000
    deleteTimeoutMs: 600000
    deleteBatchSize: 10
  accountImportDefaults:
    priority: 1
    capacity: 16
    importTimeoutMs: 120000
    groupIds: [2, 3]
    sourceProxyId: 3
    perAccountProxy: false
    planType: k12
    freeCostThresholdCny: 1
    plusCostThresholdCny: 7
  upstreamManagement:
    pageSize: 10
    defaultTemplate: codex-upstream-failover
    primaryGroupId: 2
    groupIds: [2, 3]
    priority: 1
    capacity: 16
    proxyId: 3
    # 创建接口要求名称包含正费率；创建完成后会立即探测并回写真实倍率。
    createBootstrapRateCnyPerApiUsd: 1
    # 创建时未指定成本且探测不到有效倍率时使用的回退费率。
    unprobedFallbackRateCnyPerApiUsd: 0.1
    mutationTimeoutMs: 120000
    usageConcurrency: 8
    usageTimeoutMs: 15000
    usageDays: 30
    quotaSampleIntervalSeconds: 300
    quotaSampleTimeoutSeconds: 240
    rechargeCandidates:
      lowBalanceCny: 10
      lookbackHours: 24
      recommendationLimit: 20
      retiredSuppliers: []
    failoverRules:
      - errorCode: 429
        keywords:
          - usage limit reached
          - API key 额度已用完
          - concurrency limit exceeded for account
          - rate_limit_exceeded
          - rate limit exceeded
          - rate_limit_error
          - rate limit error
          - upstream rate limit exceeded
          - too many pending requests
          - selected model is at capacity
          - "status code: 429"
          - please retry later
          - retry later
          - 服务暂时不可用，请稍后重试
        durationMinutes: 3
        description: 账号限流、并发上限或模型容量暂时不足
      - errorCode: 400
        keywords:
          - selected model is at capacity
          - our servers are currently overloaded
          - please try again later
          - upstream request failed
          - invalid_encrypted_content
          - too many pending requests
          - concurrency limit exceeded for account
          - concurrency limit exceeded
          - rate_limit_exceeded
          - rate_limit_error
        durationMinutes: 3
        description: 上游明确返回模型容量或临时过载
      - errorCode: 401
        keywords:
          - invalid api key
          - invalid_api_key
          - authentication failed
          - unauthorized
          - token expired
          - api key expired
        durationMinutes: 10
        description: 上游 API key 认证失效
      - errorCode: 402
        keywords:
          - insufficient account balance
          - insufficient balance
          - payment required
          - account balance depleted
          - billing hard limit
          - balance is insufficient
          - 余额不足
          - 欠费
        durationMinutes: 10
        description: 上游明确返回余额或账单不足
      - errorCode: 403
        keywords:
          - insufficient account balance
          - insufficient balance
          - payment required
          - account balance depleted
          - failed to validate api key
          - invalid api key
          - invalid_api_key
          - 余额不足
          - 欠费
        durationMinutes: 10
        description: 上游明确返回余额不足或 API key 失效
      - errorCode: 500
        keywords:
          - failed to validate api key
          - do request failed
          - upstream gateway error
          - upstream service temporarily unavailable
          - service temporarily unavailable
        durationMinutes: 3
        description: 上游明确返回服务或网关故障
      - errorCode: 502
        keywords:
          - overloaded
          - our servers are currently overloaded
          - stream disconnected before completion
          - upstream stream disconnected
          - concurrency limit exceeded for account
          - concurrency limit exceeded
          - rate_limit_exceeded
          - upstream rate limit exceeded
          - too many pending requests
          - please retry later
          - insufficient account balance
          - insufficient balance
          - selected model is at capacity
        durationMinutes: 3
        description: 上游持续过载、容量、限流或余额故障
      - errorCode: 502
        keywords:
          - upstream service temporarily unavailable
          - upstream request failed
          - upstream response stream was interrupted
          - service temporarily unavailable
          - 服务暂时不可用
          - origin web server returned an invalid or incomplete response
          - please try again later
          - bad_response_status_code
          - recovered upstream error 502
          - "error code: 502"
          - "status code: 502"
        durationMinutes: 3
        description: 上游网关、流中断或包装层故障
      - errorCode: 503
        keywords:
          - upstream service temporarily unavailable
          - upstream request failed
          - service temporarily unavailable
          - 服务暂时不可用
          - temporarily unavailable
          - overloaded
          - origin web server returned an invalid or incomplete response
          - our servers are currently overloaded
          - concurrency limit exceeded for account
          - concurrency limit exceeded
          - selected model is at capacity
          - too many pending requests
          - please retry later
          - rate_limit_exceeded
          - rate_limit_error
          - unexpected eof
          - bad_response_status_code
          - "error code: 503"
          - "status code: 503"
        durationMinutes: 3
        description: 上游服务暂时不可用或流响应异常
      - errorCode: 504
        keywords:
          - concurrency limit exceeded
          - concurrency limit exceeded for account
          - upstream service temporarily unavailable
          - service temporarily unavailable
          - upstream gateway error
          - gateway timeout
          - upstream timeout
          - request timeout
          - timeout awaiting response headers
          - context deadline exceeded
          - deadline exceeded
          - selected model is at capacity
          - too many pending requests
          - rate_limit_exceeded
          - rate_limit_error
          - please retry later
          - recovered upstream error 504
          - "error code: 504"
          - "status code: 504"
          - "504"
        durationMinutes: 3
        description: 上游网关或请求超时
      - errorCode: 522
        keywords:
          - upstream request failed
          - "error code: 522"
          - "status code: 522"
        durationMinutes: 3
        description: 上游连接超时
      - errorCode: 524
        keywords:
          - upstream request failed
          - upstream service temporarily unavailable
          - service temporarily unavailable
          - overloaded
          - concurrency limit exceeded
          - origin web server returned an invalid or incomplete response
          - concurrency limit exceeded for account
          - recovered upstream error 524
          - "error code: 524"
          - "status code: 524"
          - "524"
        durationMinutes: 3
        description: 上游连接或响应超时
      - errorCode: 529
        keywords:
          - overloaded
          - api is at capacity
          - the api is at capacity
          - selected model is at capacity
          - our servers are currently overloaded
        durationMinutes: 3
        description: 上游明确返回服务容量不足
  upstreamBenchmark:
    enabled: true
    provider: https://apitest.work/
    benchmarkVersion: acceptance-2026.07-compatible-v1
    model: gpt-5.6-luna
    requestTimeoutMs: 75000
  oauthEconomics:
    excludedAccountIds: [999999]
    idealApiUsdPerAccount:
      free: 3.8
      k12: 20
      plus: 135
      team: 140
  rechargeDenominationsCny: [10, 20, 50]
  planTtlMinutes: 30
  auditLimit: 200
  priorityVerificationTimeoutMs: 15000
  priorityVerificationPollMs: 500
  automationPollMs: 60000
  automationRunTimeoutMs: 600000
  automationFailureBackoffMaxMs: 60000
  automationFailureRetryLimit: 3
  automationFailureCooldownMs: 1800000
  automationJitterPercent: 0.1
  automationSafety:
    maximumScoreQueryDurationMs: 3000
  priorityWrite:
    batchSize: 3
    requestTimeoutMs: 30000
    interBatchMinimumDelayMs: 1000
    interBatchMaximumDelayMs: 2000
    maximumRetries: 3
    retryInitialDelayMs: 2000
    retryJitterPercent: 0.2

temporal:
  addressEnv: API2BUSINESS_TEMPORAL_ADDRESS
  namespace: default
  taskQueue: api2business
  scoreScheduleWorkflowId: api2business-score-refresh-schedule
  submissionTimeoutMs: 10000
  workflowExecutionTimeout: 12m
  activityStartToCloseTimeout: 10m
  retry:
    maximumAttempts: 1

runtime:
  secretsRoot: /etc/api2business/secrets
  secretSourcePaths:
    secrets/admin-password.txt: /etc/api2business/secrets/admin-password.txt
    secrets/sub2api.env: /etc/api2business/secrets/sub2api.env
    secrets/api2business.env: /etc/api2business/secrets/api2business.env
    secrets/database.env: /etc/api2business/secrets/database.env
  defaultCliTarget: local
  overApiTarget: native-api
  cliTargets:
    local:
      mode: embedded
      databasePath: .state/api2business.sqlite
      scoreCachePath: .state/account-scores.json
      monitorWorkDir: /integrations
      temporalTaskQueue: api2business-native
    production:
      mode: http
      baseUrl: https://api2business.example.com
      adminToken:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_API_KEY
    native-api:
      mode: http
      baseUrl: http://127.0.0.1:8080
      adminToken:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_API_KEY
  native:
    mode: docker-compose
    composeFile: compose.yaml
    composeProject: api2business-l1
    composeEnvFile: .state/compose/api2business.env
    stateDir: .state/native
    temporalServiceRef:
      executionPlane: route
      route: EXAMPLE:k3s
      kubeconfig: /etc/rancher/k3s/k3s.yaml
      namespace: temporal
      service: temporal-frontend
      portName: grpc
      resolutionTimeoutMs: 30000
    env:
      API2BUSINESS_WEB_PASSWORD:
        sourceRef: secrets/admin-password.txt
        sourceKey: contents
      API2BUSINESS_API_KEY:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_API_KEY
      API2BUSINESS_SESSION_SECRET:
        sourceRef: secrets/api2business.env
        sourceKey: API2BUSINESS_SESSION_SECRET
      SUB2API_ADMIN_EMAIL:
        sourceRef: secrets/sub2api.env
        sourceKey: ADMIN_EMAIL
      SUB2API_ADMIN_PASSWORD:
        sourceRef: secrets/sub2api.env
        sourceKey: ADMIN_PASSWORD
      DATABASE_URL:
        sourceRef: secrets/sub2api.env
        sourceKey: DATABASE_URL
      API2BUSINESS_DATABASE_URL:
        sourceRef: secrets/database.env
        sourceKey: API2BUSINESS_DATABASE_URL
    services:
      api:
        envKeys:
          - API2BUSINESS_WEB_PASSWORD
          - API2BUSINESS_API_KEY
          - API2BUSINESS_SESSION_SECRET
          - SUB2API_ADMIN_EMAIL
          - SUB2API_ADMIN_PASSWORD
          - DATABASE_URL
          - API2BUSINESS_DATABASE_URL
          - API2BUSINESS_TEMPORAL_ADDRESS
        command:
          - bun
          - src/api.ts
          - --config
          - config/api2business.example.yaml
          - --runtime
          - native
        pidFile: api.pid
        logFile: api.log
      worker:
        envKeys:
          - API2BUSINESS_API_KEY
          - API2BUSINESS_TEMPORAL_ADDRESS
        command:
          - go-worker/bin/api2business-temporal-worker
          - --config
          - config/api2business.example.yaml
          - --runtime
          - native
        pidFile: worker.pid
        logFile: worker.log
      web:
        envKeys: []
        command:
          - bunx
          - vite
          - --config
          - vite.config.ts
        pidFile: web.pid
        logFile: web.log
  serverTargets:
    compose:
      listenHost: 127.0.0.1
      listenPort: 8080
      workerHealthHost: 127.0.0.1
      workerHealthPort: 8081
      webListenHost: 127.0.0.1
      webListenPort: 15173
      webAllowedHosts: [api2business.example.com]
      webApiBaseUrl: http://127.0.0.1:8080
      secureCookies: false
      databasePath: .state/api2business.sqlite
      scoreCachePath: .state/account-scores.json
      monitorWorkDir: /integrations
      temporalTaskQueue: api2business-compose
      scoreScheduleWorkflowId: api2business-compose-score-refresh-schedule
      adminTokenEnv: API2BUSINESS_API_KEY
      sub2apiAdminEmailEnv: SUB2API_ADMIN_EMAIL
      sub2apiAdminPasswordEnv: SUB2API_ADMIN_PASSWORD
      scoreDatabaseUrlEnv: DATABASE_URL
      webPasswordEnv: API2BUSINESS_WEB_PASSWORD
      apiKeyEnv: API2BUSINESS_API_KEY
      sessionSecretEnv: API2BUSINESS_SESSION_SECRET
    native:
      listenHost: 127.0.0.1
      listenPort: 8080
      workerHealthHost: 127.0.0.1
      workerHealthPort: 8081
      webListenHost: 127.0.0.1
      webListenPort: 15173
      webAllowedHosts:
        - api2business.example.com
      webApiBaseUrl: http://127.0.0.1:8080
      secureCookies: false
      databasePath: .state/api2business.sqlite
      scoreCachePath: .state/account-scores.json
      monitorWorkDir: /integrations
      temporalTaskQueue: api2business-native
      scoreScheduleWorkflowId: api2business-native-score-refresh-schedule
      adminTokenEnv: API2BUSINESS_API_KEY
      sub2apiAdminEmailEnv: SUB2API_ADMIN_EMAIL
      sub2apiAdminPasswordEnv: SUB2API_ADMIN_PASSWORD
      scoreDatabaseUrlEnv: DATABASE_URL
      webPasswordEnv: API2BUSINESS_WEB_PASSWORD
      apiKeyEnv: API2BUSINESS_API_KEY
      sessionSecretEnv: API2BUSINESS_SESSION_SECRET
