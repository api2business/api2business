services:
  api:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .state/compose/api2business.env
    volumes:
      - ./config:/app/config:ro
      - ${UNIDESK_ROOT:-/workspace/unidesk}:${UNIDESK_ROOT:-/workspace/unidesk}:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - /var/lib/api2business/.state/idle-probe:/app/.state/idle-probe
      - /opt/unidesk/platform-infra/sub2api-nc01:/opt/unidesk/platform-infra/sub2api-nc01:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:ro
    command: ["bun", "src/api.ts", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.example.yaml}", "--runtime", "compose"]
  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .state/compose/api2business.env
    volumes:
      - ./config:/app/config:ro
      - ${UNIDESK_ROOT:-/workspace/unidesk}:${UNIDESK_ROOT:-/workspace/unidesk}:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - /var/lib/api2business/.state/idle-probe:/app/.state/idle-probe
      - /opt/unidesk/platform-infra/sub2api-nc01:/opt/unidesk/platform-infra/sub2api-nc01:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:ro
    command: ["bun", "src/worker.ts", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.example.yaml}", "--runtime", "compose"]
    depends_on: [api]
  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .state/compose/api2business.env
    volumes:
      - ./config:/app/config:ro
    environment:
      API2BUSINESS_CONFIG_PATH: ${API2BUSINESS_CONFIG_PATH:-config/api2business.example.yaml}
      API2BUSINESS_RUNTIME_ID: compose
    command: ["bunx", "vite", "--config", "vite.config.ts", "--host", "0.0.0.0"]
    depends_on: [api]
