services:
  api:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ${API2BUSINESS_INTEGRATION_ROOT:-./.state/integrations}:/integrations:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}/idle-probe:/app/.state/idle-probe
      # 最小权限：只挂载 config/api2business.yaml secretSourcePaths 实际引用的文件，
      # 不再把整个 Secret 根目录暴露给容器；增删引用需同步本清单。绑定单文件后
      # 轮换 Secret 需重启容器才能生效（readSecret 每次调用重读文件）。
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/unified-admin-password.txt:/root/.unidesk/.env/unified-admin-password.txt:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/sub2api.env:/root/.unidesk/.env/api2business/sub2api.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/sub2api-nc01-native.env:/root/.unidesk/.env/api2business/sub2api-nc01-native.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/sheapi.env:/root/.unidesk/.env/sheapi.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/apibase.env:/root/.unidesk/.env/apibase.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/api2business.env:/root/.unidesk/.env/api2business/api2business.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/api2business-nc01-l1-db.env:/root/.unidesk/.env/api2business/api2business-nc01-l1-db.env:ro
    command: ["bun", "src/api.ts", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}", "--runtime", "compose"]
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ${API2BUSINESS_INTEGRATION_ROOT:-./.state/integrations}:/integrations:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}/idle-probe:/app/.state/idle-probe
      # 与 api 服务相同的 Secret 最小权限清单。
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/unified-admin-password.txt:/root/.unidesk/.env/unified-admin-password.txt:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/sub2api.env:/root/.unidesk/.env/api2business/sub2api.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/sub2api-nc01-native.env:/root/.unidesk/.env/api2business/sub2api-nc01-native.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/sheapi.env:/root/.unidesk/.env/sheapi.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/apibase.env:/root/.unidesk/.env/apibase.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/api2business.env:/root/.unidesk/.env/api2business/api2business.env:ro
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}/api2business/api2business-nc01-l1-db.env:/root/.unidesk/.env/api2business/api2business-nc01-l1-db.env:ro
    command: ["/usr/local/bin/api2business-temporal-worker", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}", "--runtime", "compose"]
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 512
    depends_on: [api]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
    environment:
      API2BUSINESS_CONFIG_PATH: ${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}
      API2BUSINESS_RUNTIME_ID: compose
    command: ["bunx", "vite", "--config", "vite.config.ts"]
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 256
    depends_on: [api]
