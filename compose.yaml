services:
  api:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ${API2BUSINESS_INTEGRATION_ROOT:-./.state/integrations}:/integrations:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}/idle-probe:/app/.state/idle-probe
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:ro
    command: ["bun", "src/api.ts", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}", "--runtime", "compose"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ${API2BUSINESS_INTEGRATION_ROOT:-./.state/integrations}:/integrations:ro
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}:${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}
      - ${API2BUSINESS_STATE_ROOT:-/var/lib/api2business}/idle-probe:/app/.state/idle-probe
      - ${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:${API2BUSINESS_SECRET_ROOT:-/etc/api2business/secrets}:ro
    command: ["bun", "src/worker.ts", "--config", "${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}", "--runtime", "compose"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .state/compose/api2business.env
        required: false
    volumes:
      - ./config:/app/config:ro
    environment:
      API2BUSINESS_CONFIG_PATH: ${API2BUSINESS_CONFIG_PATH:-config/api2business.yaml}
      API2BUSINESS_RUNTIME_ID: compose
    command: ["bunx", "vite", "--config", "vite.config.ts", "--host", "0.0.0.0"]
    depends_on: [api]
