<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111412" />
  <title>账号评分 | ApiState</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js?v=score-profile-tabs-v5" type="module"></script>
</head>
<body data-page="scores">
  <div data-shell></div>
  <main class="workspace">
    <header class="page-head">
      <div><p class="eyebrow">ACCOUNT QUALITY / ALL GROUPS</p><h1>上游账号评分</h1></div>
      <div class="page-actions">
        <span id="score-state" class="state-badge">读取中</span>
        <button id="refresh-scores" class="icon-command" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
      </div>
    </header>
    <section class="metric-strip" aria-label="评分概要">
      <div><span>账号</span><strong id="metric-accounts">—</strong></div>
      <div><span>分组</span><strong id="metric-groups">—</strong></div>
      <div><span>优质</span><strong id="metric-good">—</strong></div>
      <div><span>需关注</span><strong id="metric-risk">—</strong></div>
      <div><span>评分窗口</span><strong id="metric-window">—</strong></div>
    </section>
    <section class="table-section">
      <div class="table-toolbar">
        <div class="score-query-controls">
          <div class="filter-field"><span>筛选</span><input id="score-filter" type="search" placeholder="账号或分组" /></div>
          <label class="select-field"><span>评分/计划样本</span><select id="score-call-limit"></select></label>
          <button id="query-scores" class="query-command" type="button">刷新当前状态</button>
          <button id="generate-plan" class="query-command" type="button">生成调整计划</button>
          <button id="confirm-plan" class="query-command" type="button" disabled>确认调整</button>
        </div>
        <div id="score-updated" class="refresh-clock">
          <span>上次更新时间</span>
          <strong id="score-updated-time">尚无成功快照</strong>
          <small>距离下次更新 <b id="score-countdown">--:--</b></small>
        </div>
      </div>
      <div class="profile-tabs" role="tablist" aria-label="评分账号类型">
        <button class="profile-tab is-active" type="button" role="tab" aria-selected="true" data-score-profile="codex">Codex</button>
        <button class="profile-tab" type="button" role="tab" aria-selected="false" data-score-profile="grok">Grok</button>
      </div>
      <p id="plan-refresh-state" class="section-state">尚未生成调整计划</p>
      <div id="plan-progress" class="operation-progress" aria-live="polite"></div>
      <div class="table-wrap">
        <table class="data-table" aria-label="当前账号类型评分">
          <thead><tr><th>账号</th><th>分组</th><th>当前优先级</th><th>计划优先级</th><th>变化</th><th>评分</th><th>成本</th><th>等级</th><th>置信度</th><th>尝试</th><th>失败率</th><th>TTFT P95</th><th>请求</th><th>Token</th><th class="usd-cell">API USD</th><th>切号恢复</th><th>可用</th></tr></thead>
          <tbody id="score-body"><tr><td colspan="17" class="empty">正在读取评分快照...</td></tr></tbody>
        </table>
      </div>
    </section>
    <section class="table-section">
      <div class="table-toolbar"><h2>定时自动调整</h2></div>
      <form id="automation-form" class="score-query-controls">
        <label class="select-field"><span>状态</span><select id="automation-enabled"><option value="true">启用</option><option value="false">停用</option></select></label>
        <label class="filter-field"><span>周期（秒）</span><input id="automation-interval" type="number" min="5" max="86400" required /></label>
        <label class="select-field"><span>样本</span><select id="automation-limit"></select></label>
        <button class="query-command" type="submit">保存运行时配置</button>
      </form>
      <p id="automation-state" class="section-state">正在读取配置…</p>
    </section>
    <section class="table-section">
      <div class="table-toolbar">
        <h2>调整记录</h2>
        <div class="score-query-controls">
          <button id="history-prev" class="query-command" type="button" disabled>上一页</button>
          <span id="history-page-state" class="section-state" aria-live="polite">正在读取…</span>
          <button id="history-next" class="query-command" type="button" disabled>下一页</button>
          <button id="refresh-history" class="query-command" type="button">刷新记录</button>
        </div>
      </div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>调优池</th><th>开始时间</th><th>方式</th><th>状态</th><th>操作者</th><th>样本</th><th>调整数</th><th>完成时间</th><th>耗时</th></tr></thead><tbody id="priority-history-body"><tr><td colspan="9" class="empty">正在读取调整记录</td></tr></tbody></table></div>
    </section>
  </main>
</body>
</html>
