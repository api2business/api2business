<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111412" />
  <link rel="icon" href="/api2business-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon-192.png" />
  <title>用户用量 | Api2Business</title>
  <link rel="stylesheet" href="/styles.css?v=status-visibility-v1" />
  <script src="/app.js?v=user-ranking-v2" type="module"></script>
</head>
<body data-page="ranking">
  <div data-shell></div>
  <main class="workspace">
    <header class="page-head ranking-head"><div><p class="eyebrow">USER FLOW / DAILY</p><h1>用户用量</h1><p id="ranking-state" class="section-state">通过单连接队列读取今日用量</p></div><div class="ranking-controls"><label class="select-field"><span>自动刷新</span><select id="ranking-refresh-interval"><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="120">2 分钟</option><option value="300">5 分钟</option><option value="0">关闭</option></select></label><small id="ranking-refresh-countdown" class="oauth-refresh-countdown">下次刷新 --:--</small><button id="ranking-refresh" class="query-command" type="button"><span class="query-spinner" aria-hidden="true"></span><span>手动刷新</span></button><span id="ranking-range" class="state-badge">读取中</span></div></header>
    <section class="metric-strip ranking-metrics"><div><span>标准 API 用量</span><strong id="ranking-cost">—</strong></div><div><span>剩余余额</span><strong id="ranking-balance">—</strong></div><div><span>今日充值</span><strong id="ranking-recharge">—</strong></div><div><span>请求</span><strong id="ranking-requests">—</strong></div><div><span>Token</span><strong id="ranking-tokens">—</strong></div></section>
    <section class="table-section"><div class="table-wrap"><table class="data-table ranking-table"><colgroup><col class="ranking-col-rank"><col class="ranking-col-user"><col class="ranking-col-cost"><col class="ranking-col-balance"><col class="ranking-col-recharge"><col class="ranking-col-requests"><col class="ranking-col-tokens"></colgroup><thead><tr><th>名次</th><th>用户邮箱</th><th class="usd-cell">API USD</th><th class="usd-cell">剩余余额</th><th class="usd-cell">今日充值</th><th class="usd-cell">请求</th><th class="usd-cell">Token</th></tr></thead><tbody id="ranking-body"><tr><td colspan="7" class="empty">正在读取用量...</td></tr></tbody></table></div></section>
  </main>
</body>
</html>
