<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#111412" /><link rel="icon" href="/api2business-icon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/styles.css?v=quota-monitor-v4" /><script src="/app.js?v=quota-monitor-v3" type="module"></script><title>额度监控 | Api2Business</title></head>
<body data-page="quota-monitor"><div data-shell></div><main class="workspace">
  <header class="page-head"><div><p class="eyebrow">QUOTA MONITOR / ACCOUNT LEVEL</p><h1>额度监控</h1><p id="quota-monitor-state" class="section-state">正在读取已有额度缓存…</p></div><div class="page-actions"><button id="quota-monitor-refresh" class="query-command" type="button">刷新缓存视图</button></div></header>
  <section id="quota-group-cards" class="quota-group-cards" aria-label="额度分组剩余比例"><article class="empty">正在读取四个额度分组…</article></section>
  <section class="table-section"><div class="table-toolbar"><div><h2>上游钱包级额度</h2><p class="section-state">同一上游钱包的多个账号合并为一行，余额来自上游资产汇总，消耗按人民币换算</p><nav id="quota-monitor-filters" class="quota-monitor-filters" aria-label="额度分组筛选"><button type="button" class="quota-filter is-active" data-quota-filter="all">全部</button><button type="button" class="quota-filter" data-quota-filter="codex-mix">GPT混池</button><button type="button" class="quota-filter" data-quota-filter="no-degrade">GPT不降智</button><button type="button" class="quota-filter" data-quota-filter="claude">Claude</button><button type="button" class="quota-filter" data-quota-filter="grok">Grok</button></nav></div><nav class="table-pagination" aria-label="上游钱包额度分页"><button id="quota-monitor-prev" class="query-command" type="button" disabled>上一页</button><span id="quota-monitor-page" class="section-state">1 / 1</span><button id="quota-monitor-next" class="query-command" type="button" disabled>下一页</button></nav></div>
    <div class="table-wrap"><table class="data-table quota-monitor-table"><thead><tr><th data-quota-sort="name" aria-sort="none">上游钱包</th><th data-quota-sort="remaining" aria-sort="descending">剩余额度</th><th data-quota-sort="consumed24h" aria-sort="none">24h 消耗总额</th><th data-quota-sort="consumption.codex-mix" aria-sort="none">Codex 混池消耗</th><th data-quota-sort="consumption.no-degrade" aria-sort="none">不降智消耗</th><th data-quota-sort="consumption.claude" aria-sort="none">Claude 消耗</th><th data-quota-sort="consumption.grok" aria-sort="none">Grok 消耗</th><th>关联分组</th></tr></thead><tbody id="quota-monitor-body"><tr><td colspan="8" class="empty">正在读取额度缓存…</td></tr></tbody></table></div></section>
</main></body></html>
