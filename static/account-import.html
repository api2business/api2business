<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#111412" /><title>账号导入 | ApiState</title><link rel="stylesheet" href="/styles.css" /><script src="/app.js" type="module"></script></head>
<body data-page="account-import"><div data-shell></div><main class="workspace import-workspace">
  <header class="page-head"><div><p class="eyebrow">ACCOUNT RUNTIME / CONTROLLED IMPORT</p><h1>账号批量导入</h1></div><span id="import-state" class="state-badge">等待输入</span></header>
  <section class="import-layout">
    <form id="import-form" class="import-form">
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button"><strong>拖拽 JSON 到这里</strong><span>或点击选择文件</span><small id="file-state">尚未选择文件</small><input id="import-file" type="file" accept="application/json,.json" hidden /></div>
      <label class="json-field"><span>JSON 内容</span><textarea id="import-json" spellcheck="false" placeholder="粘贴 Sub2API 导出的 JSON"></textarea></label>
      <div class="import-settings">
        <label><span>优先级</span><input id="import-priority" type="number" min="1" max="1000" value="1" required /></label>
        <label><span>容量</span><input id="import-capacity" type="number" min="1" value="5" required /></label>
        <label><span>Proxy ID</span><input id="import-proxy" type="number" min="1" value="3" required /></label>
        <label class="toggle-field"><input id="import-shadow" type="checkbox" checked /><span>创建独立影子 Proxy</span></label>
      </div>
      <fieldset class="group-picker"><legend>目标分组</legend><div id="import-groups"></div></fieldset>
      <button id="import-submit" class="primary-command" type="submit">确认导入</button>
    </form>
    <section class="import-console"><header><div><p class="eyebrow">JOB STREAM</p><h2>导入日志</h2></div><code id="import-job-id">JOB —</code></header><div id="import-summary" class="import-summary">等待提交导入作业</div><ol id="import-logs" class="import-logs"><li class="empty">暂无日志</li></ol></section>
  </section>
</main></body></html>
