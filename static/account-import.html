<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#111412" /><link rel="icon" href="/api2business-icon.svg" type="image/svg+xml" /><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" /><link rel="apple-touch-icon" href="/favicon-192.png" /><title>账号导入 | Api2Business</title><link rel="stylesheet" href="/styles.css?v=import-load-factor-v1" /><script src="/app.js?v=import-load-factor-v1" type="module"></script></head>
<body data-page="account-import"><div data-shell></div><main class="workspace import-workspace">
  <header class="page-head"><div><p class="eyebrow">ACCOUNT RUNTIME / CONTROLLED IMPORT</p><h1>账号批量导入</h1></div><span id="import-state" class="state-badge">等待输入</span></header>
  <section class="import-layout">
    <form id="import-form" class="import-form">
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button"><strong>拖拽 JSON、TXT 或 ZIP 到这里</strong><span>或点击选择文件</span><small id="file-state">尚未选择文件</small><input id="import-file" type="file" accept="application/json,application/zip,text/plain,.json,.txt,.zip" hidden /></div>
      <label class="json-field"><span>合并后的 JSON</span><textarea id="import-json" spellcheck="false" placeholder="粘贴 Sub2API 导出的 JSON"></textarea></label>
      <p id="import-platform-state" class="section-state">等待识别 Codex 或 Grok</p>
      <div class="import-settings">
        <label><span>导入平台</span><select id="import-platform"><option value="auto">自动识别</option><option value="openai">Codex</option><option value="grok">Grok</option></select></label>
        <label><span>优先级</span><input id="import-priority" type="number" min="1" max="1000" value="1" required /></label>
        <label><span>容量</span><input id="import-capacity" type="number" min="1" value="16" required /></label>
        <label><span>负载因子</span><input id="import-rate-multiplier" type="number" min="1" max="1000000" step="1" value="1000" required /></label>
        <label><span>账号总价（人民币）</span><input id="import-total-cost" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" /></label>
        <label><span>账号单价（人民币）</span><input id="import-unit-cost" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required /></label>
        <label><span>账号类型</span><select id="import-plan-type" required></select></label>
        <details class="import-advanced">
          <summary>高级设置</summary>
          <div class="import-advanced-grid">
            <label><span>代理池基准 ID</span><input id="import-proxy" type="number" min="3" value="3" required /></label>
            <label class="toggle-field"><input id="import-per-account-proxy" type="checkbox" /><span>逐账号独立随机分配 Proxy</span></label>
          </div>
        </details>
      </div>
      <fieldset class="group-picker"><legend>目标分组</legend><div id="import-groups"></div></fieldset>
      <button id="import-submit" class="primary-command" type="submit">导入账号</button>
    </form>
    <section class="import-console"><header><div><p class="eyebrow">JOB STREAM</p><h2>导入结果</h2></div><code id="import-job-id">JOB —</code></header>
      <div id="import-economics" class="import-economics is-pending" aria-live="polite">
        <div><span>本批采购成本</span><strong id="import-acquisition-cost">—</strong><small id="import-accounted-count">等待导入终态</small></div>
        <div><span>初始预期产出</span><strong id="import-expected-output">—</strong><small id="import-expected-basis">按账号类型核算</small></div>
        <div class="import-economics-primary"><span>初始预期成本</span><strong id="import-expected-cost">—</strong><small>人民币 / API 美元</small></div>
      </div>
      <div id="import-summary" class="import-summary">等待提交导入作业</div>
      <div class="import-log-heading"><span>作业日志</span><small>按时间顺序保留导入、校验与记账证据</small></div>
      <ol id="import-logs" class="import-logs"><li class="empty">暂无日志</li></ol>
    </section>
  </section>
</main>
<dialog id="import-plan-confirm-dialog" class="import-confirm-dialog" aria-labelledby="import-confirm-title">
  <form id="import-plan-confirm-form" method="dialog">
    <header><div><p class="eyebrow">FINAL ACCOUNT TYPE</p><h2 id="import-confirm-title">确认账号类型</h2></div><button id="import-confirm-close-icon" class="icon-command" type="button" title="关闭" aria-label="关闭">×</button></header>
    <div class="import-confirm-summary" aria-label="本批导入摘要">
      <div><span>账号</span><strong id="import-confirm-account-count">—</strong></div>
      <div><span>平台</span><strong id="import-confirm-platform">—</strong></div>
      <div><span>单价</span><strong id="import-confirm-unit-cost">—</strong></div>
    </div>
    <fieldset class="import-confirm-type-picker"><legend>本批账号属于</legend><div id="import-confirm-types"></div></fieldset>
    <p id="import-confirm-state" class="dialog-state">请选择一个账号类型后提交。</p>
    <footer><button id="import-confirm-cancel" class="text-command" type="button">取消</button><button id="import-confirm-submit" class="primary-command" type="submit" disabled>按所选类型导入</button></footer>
  </form>
</dialog>
</body></html>
