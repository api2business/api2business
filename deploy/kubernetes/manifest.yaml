apiVersion: v1
kind: ConfigMap
metadata:
  name: api2business-config
binaryData:
  api2business.yaml: __API2BUSINESS_CONFIG_BASE64__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2business
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api2business
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api2business
      annotations:
        api2business.dev/source-commit: __API2BUSINESS_SOURCE_COMMIT__
        api2business.dev/config-sha256: __API2BUSINESS_CONFIG_SHA256__
    spec:
      containers:
        - name: api
          image: __API2BUSINESS_IMAGE_REF__
          args: ["bun", "src/api.ts", "--config", "/etc/api2business/api2business.yaml", "--runtime", "k8s"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/api2business
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/api2business
              readOnly: true
        - name: worker
          image: __API2BUSINESS_IMAGE_REF__
          args: ["bun", "src/worker.ts", "--config", "/etc/api2business/api2business.yaml", "--runtime", "k8s"]
          volumeMounts:
            - name: config
              mountPath: /etc/api2business
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/api2business
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: api2business-config
        - name: secrets
          secret:
            secretName: api2business-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api2business
spec:
  selector:
    app.kubernetes.io/name: api2business
  ports:
    - name: http
      port: 8080
      targetPort: http
